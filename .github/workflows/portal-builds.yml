name: Portal builds

# Builds the CrazyGames, Poki and itch.io zips (tools/package_portals.py) and
# attaches them to the run as one downloadable artifact. Runs on every push to
# main and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/package_portals.py
      - uses: actions/upload-artifact@v4
        with:
          name: street-football-portal-builds
          path: |
            portal-builds/*.zip
            portal-kit/
          retention-days: 90
