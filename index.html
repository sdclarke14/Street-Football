<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Street Football</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Street Football" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c2430" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 240px;
        font-family: system-ui, sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        user-select: none;
      }
      #stamina-track {
        height: 14px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      #stamina-fill {
        height: 100%;
        width: 100%;
        border-radius: 7px;
        background: #22c55e;
        transition: background-color 0.3s;
      }
      #stamina-label {
        margin-top: 4px;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      #pickup {
        margin-top: 8px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #d4f00f;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        opacity: 0;
        transition: opacity 0.1s;
      }
      #score {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        user-select: none;
      }
      #downdist {
        position: fixed;
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #ffd54a;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        user-select: none;
      }
      #banner {
        position: fixed;
        top: 35%;
        left: 50%;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        font-size: 42px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        display: none;
        user-select: none;
      }
      #controls {
        position: fixed;
        bottom: 12px;
        left: 16px;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        user-select: none;
      }
      #targets {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        user-select: none;
      }
      .chip {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        font-size: 19px;
        font-weight: 800;
        color: #1a1a1a;
        background: #8a8a84;
        border: 3px solid #1a1a1a;
        opacity: 0.5;
        transition: background-color 0.15s, opacity 0.15s;
      }
      .chip.live {
        background: #ffd54a;
        opacity: 1;
      }
      .chip.off {
        opacity: 0.18;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="stamina-track"><div id="stamina-fill"></div></div>
      <div id="stamina-label">TURBO — hold Shift to sprint</div>
      <div id="pickup"></div>
    </div>
    <div id="score">BLUE 0 — 0 RED</div>
    <div id="downdist"></div>
    <div id="banner"></div>
    <div id="targets">
      <div id="chip-a" class="chip">A</div>
      <div id="chip-s" class="chip">S</div>
      <div id="chip-d" class="chip">D</div>
      <div id="chip-f" class="chip">F</div>
    </div>
    <div id="controls">Arrows move · Shift sprint</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
