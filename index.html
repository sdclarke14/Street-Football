<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Street Football — 7 on 7</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Street Football" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1512" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0f1512;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }
      #app,
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Shown until the player models finish loading. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: #0f1512;
        color: #fff;
        font-family: -apple-system, system-ui, sans-serif;
        transition: opacity 0.4s;
      }
      #boot b {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      #boot b span {
        color: #b9f227;
      }
      #boot i {
        display: block;
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: #26302a;
        overflow: hidden;
        position: relative;
      }
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: #b9f227;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><b>STREET <span>FOOTBALL</span></b><i></i></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
